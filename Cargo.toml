[package]
name = "war-game"
version = "0.1.0"
edition = "2021"
default-run = "war-game"

[dependencies]
bevy = { version = "=0.15.3", features = ["wav"] }
bevy_egui = "=0.32.0"
rand = "0.8"

# Fast dev builds: our code unoptimized-ish, dependencies fully optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
